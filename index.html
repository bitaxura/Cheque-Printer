<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Check Printer</title>
    <style>
        :root {
            --bg: #f6f6f4;
            --fg: #1c1c1c;
            --card: #fff;
            --bd: #d4d4d0;
            --ac: #1a5fb4;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #16171a;
                --fg: #ececec;
                --card: #222428;
                --bd: #3a3d44;
                --ac: #6ea8fe;
            }
        }

        :root[data-theme="dark"] {
            --bg: #16171a;
            --fg: #ececec;
            --card: #222428;
            --bd: #3a3d44;
            --ac: #6ea8fe;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.4 system-ui, sans-serif;
        }

        main {
            max-width: 820px;
            margin: 0 auto;
            padding: 16px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input[type=text],
        input[type=date] {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            background: var(--bg);
            color: var(--fg);
            font: inherit;
        }

        input[type=number] {
            width: 78px;
            padding: 5px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            background: var(--bg);
            color: var(--fg);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 8px;
            background: var(--ac);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button.sec {
            background: transparent;
            color: var(--ac);
            border: 1px solid var(--ac);
        }

        .scroll {
            overflow-x: auto;
        }

        table {
            border-collapse: collapse;
            font-size: 13px;
        }

        td,
        th {
            padding: 4px 8px;
            text-align: left;
        }

        .preview {
            overflow-x: auto;
            padding: 10px;
            background: var(--bg);
            border: 1px dashed var(--bd);
            border-radius: 8px;
        }

        #check {
            position: relative;
            width: 7.25in;
            height: 3.25in;
            background: #fff;
            color: #000;
            outline: 1px solid #999;
            font-family: "Courier New", monospace;
            font-size: 12pt;
        }

        .f {
            position: absolute;
            white-space: nowrap;
            line-height: 1;
        }

        .guide {
            position: absolute;
            border: 0 solid #e33;
            pointer-events: none;
        }

        .noguides .guide {
            display: none;
        }

        .hint {
            font-size: 12px;
            opacity: 0.75;
        }

        @page {
            size: 7.25in 3.25in;
            margin: 0;
        }

        @media print {

            html,
            body {
                background: #fff !important;
                margin: 0;
                padding: 0;
            }

            :root {
                padding: 0;
            }

            main>*:not(.printwrap) {
                display: none !important;
            }

            main {
                padding: 0;
                max-width: none;
            }

            .printwrap,
            .preview {
                padding: 0;
                border: 0;
                background: #fff;
                overflow: visible;
            }

            #check {
                outline: none;
                margin: 0;
            }

            .noprintguides .guide {
                display: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Check Printer <span class="hint">7.25" × 3.25"</span></h1>

        <div class="card">
            <div class="row">
                <label>Pay to
                    <input type="text" id="payee" value="John Smith">
                </label>
                <label>Amount
                    <input type="text" id="amount" value="1234.56" inputmode="decimal">
                </label>
                <label>Date
                    <input type="date" id="date">
                </label>
                <label>Memo
                    <input type="text" id="memo">
                </label>
            </div>
        </div>

        <div class="card printwrap">
            <div class="preview" id="pv">
                <div id="check"></div>
            </div>
        </div>

        <div class="card">
            <button id="print">Print check</button>
            <button class="sec" id="g">Toggle guide lines</button>
            <label style="margin-top: 10px; display: inline-block;">
                <input type="checkbox" id="pg"> include guide lines in print (for a plain-paper test)
            </label>
            <p class="hint">In the print dialog set scale to 100% / Actual size, margins None, and paper size to match
                your check.</p>
        </div>

        <div class="card">
            <strong>Positions (inches from top-left of check)</strong>
            <p class="hint">Text sits just above the Y value (the line). Nudge after a test print.</p>
            <div class="scroll">
                <table id="tb"></table>
            </div>
            <p style="margin-top: 10px;">
                Global shift:
                X <input type="number" step="0.01" id="gx" value="0">
                Y <input type="number" step="0.01" id="gy" value="0">
                <button class="sec" id="reset" style="padding: 5px 10px;">Reset</button>
            </p>
        </div>
    </main>

    <script>
        var DEF = {
            payee: { x: 1, y: 1 + 7 / 16 - 1 / 25.4, label: "Pay to line (baseline)" },
            words: { x: 1 / 4, y: 1 + 13 / 16 - 1 / 25.4, label: "Written amount line (baseline)" },
            amt: { x: 5 + 11 / 16, y: 1.25, w: 1.25, h: 0.3125, label: "Amount box (left / top)" },
            date: { x: 5 + 15.5 / 16 - 1 / 25.4, y: 0.75, w: 4 / 25.4, h: 5 / 25.4, label: "Date first box (left / top)" },
            memo: { x: 0.5, y: 2 + 9 / 16, label: "Memo (baseline)" }
        };

        var P = JSON.parse(JSON.stringify(DEF));

        try {
            var s = localStorage.getItem("chk6");
            if (s) {
                var o = JSON.parse(s);
                for (var k in o) {
                    if (P[k]) Object.assign(P[k], o[k]);
                }
            }
        } catch (e) { }

        var gx = 0,
            gy = 0,
            GAP = 1;

        var $ = function (i) {
            return document.getElementById(i);
        };

        $("date").value = new Date().toLocaleDateString("en-CA");

        var ones = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
        var tens = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];

        function below1000(n) {
            var s = "";
            if (n >= 100) {
                s += ones[Math.floor(n / 100)] + " hundred";
                n %= 100;
                if (n) s += " ";
            }
            if (n >= 20) {
                s += tens[Math.floor(n / 10)];
                if (n % 10) s += "-" + ones[n % 10];
            } else if (n) {
                s += ones[n];
            }
            return s;
        }

        function words(n) {
            if (n === 0) return "zero";
            var u = ["", "thousand", "million", "billion"],
                i = 0,
                out = [];
            while (n > 0) {
                var c = n % 1000;
                if (c) out.unshift(below1000(c) + (u[i] ? " " + u[i] : ""));
                n = Math.floor(n / 1000);
                i++;
            }
            return out.join(" ");
        }

        function cap(s) {
            return s.charAt(0).toUpperCase() + s.slice(1);
        }

        function render() {
            var raw = parseFloat(($("amount").value || "").replace(/[$,]/g, ""));
            var ok = !isNaN(raw) && raw >= 0 && raw < 1e12;
            var cents = ok ? Math.round(raw * 100) : 0,
                d = Math.floor(cents / 100),
                c = cents % 100;
            var num = ok ? d.toLocaleString("en-US") + "." + (c < 10 ? "0" : "") + c : "";
            var wd = ok ? cap(words(d)) + " and " + (c < 10 ? "0" : "") + c + "/100 ***" : "";
            var el = $("check");
            el.innerHTML = "";

            function add(p, txt, cls, extra) {
                var e = document.createElement("div");
                e.className = "f";
                e.textContent = txt;
                e.style.left = (p.x + gx) + "in";
                e.style.top = (p.y + gy) + "in";
                e.style.transform = "translateY(-100%)";
                e.style.paddingBottom = "0.03in";
                if (extra) e.style.cssText += extra;
                el.appendChild(e);
            }

            add(P.payee, $("payee").value);
            add(P.words, wd, 0, "font-size:10.5pt");
            add(P.memo, $("memo").value, 0, "font-size:10.5pt");

            var a = document.createElement("div");
            a.className = "f";
            a.textContent = num;
            a.style.cssText += "left:" + (P.amt.x + gx) + "in;top:" + (P.amt.y + gy) + "in;width:" + P.amt.w + "in;height:" + P.amt.h + "in;display:flex;align-items:center;padding-left:0.08in";
            el.appendChild(a);

            var dv = $("date").value || "",
                dg = dv.length >= 10 ? dv.slice(2, 4) + dv.slice(5, 7) + dv.slice(8, 10) : "";
            var pitch = P.date.w + GAP / 25.4;

            for (var i = 0; i < 6; i++) {
                var db = document.createElement("div");
                db.className = "f";
                db.textContent = dg.charAt(i);
                db.style.cssText += "left:" + (P.date.x + gx + i * pitch) + "in;top:" + (P.date.y + gy) + "in;width:" + P.date.w + "in;height:" + P.date.h + "in;display:flex;align-items:center;justify-content:center;font-size:9.5pt";
                el.appendChild(db);

                var bx = gl(P.date.x + i * pitch, P.date.y, P.date.w, P.date.h);
                bx.style.borderWidth = "1px";
                bx.style.borderColor = "#e33";
                el.appendChild(bx);
            }

            // guides
            function gl(x, y, w, h) {
                var g = document.createElement("div");
                g.className = "guide";
                g.style.cssText += "left:" + (x + gx) + "in;top:" + (y + gy) + "in;width:" + w + "in;height:" + h + "in;";
                return g;
            }

            [[P.payee, 4.25], [P.words, 5.25]].forEach(function (a) {
                var g = gl(a[0].x, a[0].y, a[1], 0);
                g.style.borderTopWidth = "1px";
                g.style.borderColor = "#e33";
                el.appendChild(g);
            });

            var b = gl(P.amt.x, P.amt.y, P.amt.w, P.amt.h);
            b.style.borderWidth = "1px";
            b.style.borderColor = "#e33";
            el.appendChild(b);

            var gm = gl(P.memo.x, P.memo.y, 3, 0);
            gm.style.borderTopWidth = "1px";
            gm.style.borderColor = "#e33";
            el.appendChild(gm);
        }

        function table() {
            var t = $("tb");
            t.innerHTML = "<tr><th>Field</th><th>X</th><th>Y</th></tr>";

            Object.keys(P).forEach(function (k) {
                var r = document.createElement("tr");
                r.innerHTML = "<td>" + P[k].label + "</td><td><input type=number step=0.01 data-k=" + k + " data-a=x value=" + P[k].x.toFixed(4) + "></td><td><input type=number step=0.01 data-k=" + k + " data-a=y value=" + P[k].y.toFixed(4) + "></td>";
                t.appendChild(r);
            });

            t.querySelectorAll("input").forEach(function (i) {
                i.oninput = function () {
                    var v = parseFloat(i.value);
                    if (isNaN(v)) return;
                    P[i.dataset.k][i.dataset.a] = v;
                    save();
                    render();
                };
            });
        }

        function save() {
            try {
                localStorage.setItem("chk6", JSON.stringify(P));
            } catch (e) { }
        }

        ["payee", "amount", "date", "memo"].forEach(function (i) {
            $(i).oninput = render;
        });

        $("gx").oninput = function () {
            gx = parseFloat(this.value) || 0;
            render();
        };

        $("gy").oninput = function () {
            gy = parseFloat(this.value) || 0;
            render();
        };

        $("g").onclick = function () {
            document.body.classList.toggle("noguides");
        };

        $("reset").onclick = function () {
            P = JSON.parse(JSON.stringify(DEF));
            save();
            table();
            render();
        };

        $("print").onclick = function () {
            document.body.classList.toggle("noprintguides", !$("pg").checked);
            window.print();
        };

        document.body.classList.add("noprintguides");
        table();
        render();
    </script>
</body>

</html>
